# ========================
# Mini D-Mart — Application Configuration
# ========================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mini-dmart
  config:
    import: optional:file:.env[.properties]

  # ---- Database DataSource ----
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minidmart}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# ========================
# Application Properties
# ========================
app:
  inventory:
    low-stock-threshold: 10
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-32-chars-long}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900000}       # 15 minutes
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:}

# ========================
# SpringDoc / Swagger
# ========================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
